<div class="min-h-full flex flex-col items-center px-4 py-12">
  <a class="mb-4" routerLink="/">
    <img
      src="assets/images/full-logo.png"
      width="180"
      height="180"
      [alt]="'app.name' | translate"
    />
  </a>

  <div
    class="w-full max-w-sm rounded-xl border border-border/40 bg-background-alt p-6 sm:p-8 shadow-sm"
  >
    <h1 class="mt-0 mb-6 text-center text-2xl font-semibold">
      {{ 'auth.resetPassword.title' | translate }}
    </h1>

    <p class="mb-6 text-sm text-muted">
      {{ 'auth.resetPassword.instructions' | translate }}
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <nmf-mat-text
        type="password"
        formControlName="password"
        [label]="'auth.shared.passwordLabel' | translate"
      />

      <nmf-mat-text
        type="password"
        formControlName="confirmPassword"
        [label]="'auth.shared.confirmPasswordLabel' | translate"
      />

      <p class="m-0 text-center text-sm text-danger">
        @if (form.hasError('custom')) {
          {{ form.getError('custom') | translate }}
        }

        @if (form.hasError('passwordMismatch')) {
          {{ 'errors.passwordMismatch' | translate }}
        }
      </p>

      <app-button
        class="text-center"
        color="primary"
        type="submit"
        label="auth.resetPassword.submitButton"
        [disabled]="!form.dirty || isSubmitting()"
        [loading]="isSubmitting()"
      ></app-button>
    </form>
  </div>
</div>
