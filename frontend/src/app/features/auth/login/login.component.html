<div class="min-h-full flex flex-col items-center px-4 py-12">
  <a class="mb-4" routerLink="/">
    <img
      src="assets/images/full-logo.png"
      width="180"
      height="180"
      [alt]="'app.name' | translate"
    />
  </a>

  <div
    class="w-full max-w-sm rounded-xl border border-border/40 bg-background-alt p-6 sm:p-8 shadow-sm"
  >
    <div class="mb-8 text-center">
      <h1 class="m-0 text-2xl font-semibold">
        {{ 'auth.login.title' | translate }}
      </h1>
    </div>

    <form [formGroup]="form()" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <nmf-mat-text
        formControlName="username"
        [label]="'auth.shared.usernameOrEmailLabel' | translate"
        [placeholder]="'auth.shared.usernameOrEmailLabel' | translate"
      />

      <div class="flex flex-col">
        <nmf-mat-text
          type="password"
          formControlName="password"
          [label]="'auth.shared.passwordLabel' | translate"
          [placeholder]="'auth.shared.passwordLabel' | translate"
        />

        <a class="text-sm self-end" routerLink="/app/auth/forgot-password">Forgot password?</a>
      </div>

      @if (errorMessage() || form().hasError('custom')) {
        <p class="m-0 text-center text-sm text-danger">
          {{ errorMessage() || form().getError('custom') | translate }}
        </p>
      }

      <app-button
        class="text-center"
        color="primary"
        type="submit"
        label="auth.login.submitButton"
        [disabled]="!form().dirty || isSubmitting()"
        [loading]="isSubmitting()"
      ></app-button>
    </form>

    <p class="mt-6 mb-0 text-center text-sm text-muted">
      {{ 'auth.login.noAccount' | translate }}
      <a routerLink="/app/auth/register" class="font-medium hover:underline">
        {{ 'auth.shared.registerLinkText' | translate }}
      </a>
    </p>
  </div>
</div>
