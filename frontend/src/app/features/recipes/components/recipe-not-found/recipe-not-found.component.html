<section class="flex min-h-[60vh] flex-col items-center justify-center text-center">
  <div
    class="mb-6 flex h-16 w-16 items-center justify-center rounded-full border border-border/40 bg-background-alt"
  >
    <mat-icon class="text-3xl text-muted">restaurant</mat-icon>
  </div>
  <h1 class="m-0 text-2xl font-semibold">{{ 'recipes.notFound.title' | translate }}</h1>
  <p class="mt-3 max-w-md text-sm text-muted">
    {{ 'recipes.notFound.message' | translate }}
  </p>
  <div class="mt-6">
    <ng-content select="[backAction]"></ng-content>
  </div>
</section>
