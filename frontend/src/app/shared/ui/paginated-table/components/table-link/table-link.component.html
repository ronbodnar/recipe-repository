@if (transformedLabel !== EM_DASH && routerLink) {
  <a
    [routerLink]="routerLink"
    (click)="handleClick($event)"
    class="{{ clamp ? 'block line-clamp-' + clamp : 'inline' }} cursor-pointer {{
      applyOpacity ? 'opacity-50' : ''
    }}"
    [matTooltip]="transformedLabel"
    [matTooltipPosition]="'above'"
  >
    {{ transformedLabel | translate }}
  </a>
} @else {
  {{ transformedLabel | translate }}
}
