name: Recipe Service CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/services/recipe-service/**'
      - 'backend/services/common-core/**'
      - 'backend/services/identity-service-client/**'
      - 'backend/services/image-service-client/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Recipe Service
        run: ./mvnw -pl services/recipe-service -am package -DskipTests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend/services/recipe-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rr-recipe-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
