app:
  aws:
    s3:
      bucket-name: recipe-repository

  password-reset-url: https://recipes.ronbodnar.com/app/auth/reset-password?token=

  registration:
    codeRequired: true
    url: https://recipes.ronbodnar.com/app/auth/register?code=

  groups:
    enabled: false
    invitation-url: https://recipes.ronbodnar.com/app/groups/GROUP_ID/invite/

spring:
  jpa:
    show-sql: false

  data:
    redis:
      host: recipe-repository-redis
      port: 6379