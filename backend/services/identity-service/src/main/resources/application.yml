app:
  services:
    image-service: http://localhost:8083

server:
  port: 8082
  forward-headers-strategy: native

spring:
  config:
    import: optional:file:./secrets/identity-service.properties

  application:
    name: identity-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        show_sql: false
        format_sql: true
        use_sql_comments: true
        generate_statistics: false

  sql:
    init:
      mode: always

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${APP_KEYCLOAK_JWK_SET_URI}

      client:
        registration:
          keycloak:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: ${APP_KEYCLOAK_SERVICE_CLIENT_ID}
            client-secret: ${APP_KEYCLOAK_SERVICE_CLIENT_SECRET}

        provider:
          keycloak:
            token-uri: ${APP_KEYCLOAK_URI}/realms/${APP_KEYCLOAK_REALM}/protocol/openid-connect/token

logging:
  level:
    root: INFO
    org.springframework.security: TRACE
    org.hibernate.orm.connections.pooling: ERROR
    org.springframework.jdbc.core: INFO
    org.springframework.jdbc.core.namedparam: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBindeR: INFO
    com.fasterxml.jackson.databind: INFO
    org.springframework.http.converter: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO