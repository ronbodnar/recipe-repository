app:
  aws:
    s3:
      bucket-name: recipe-repository
  images:
    cleanup-interval: 60000 # once per minute

server:
  port: 8082
  forward-headers-strategy: native
  tomcat:
    max-swallow-size: 100MB

spring:
  config:
    import: optional:file:./secrets/image-service.properties

  application:
    name: image-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        show_sql: false
        format_sql: true
        use_sql_comments: true
        generate_statistics: false

  sql:
    init:
      mode: always

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${APP_KEYCLOAK_JWK_SET_URI}

  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: 5MB
      max-request-size: 25MB

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.orm.connections.pooling: ERROR
    org.springframework.jdbc.core: INFO
    org.springframework.jdbc.core.namedparam: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBindeR: INFO
    com.fasterxml.jackson.databind: INFO
    org.springframework.http.converter: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO